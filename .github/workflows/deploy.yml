name: Deploy to Rumahweb Shared Hosting

on:
  push:
    branches:
      - main      # Deploy saat push ke branch main
      - master    # Atau master (sesuaikan dengan branch utama Anda)
  workflow_dispatch:  # Memungkinkan manual trigger dari GitHub UI

jobs:
  deploy:
    name: Deploy Laravel Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Untuk git diff dengan commit sebelumnya

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
          tools: composer:v2

      # 3. Cache Composer dependencies
      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 4. Install Composer Dependencies (production only)
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-dev --no-scripts --no-progress --optimize-autoloader

      # 5. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 6. Cache Node modules
      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 7. Install NPM Dependencies
      - name: Install NPM Dependencies
        run: npm ci

      # 8. Build Assets
      - name: Build Production Assets
        run: npm run build

      # 9. Create deployment package (exclude unnecessary files)
      - name: Create Deployment Package
        run: |
          mkdir -p deploy-package
          rsync -av --progress \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='README.md' \
            --exclude='AGENTS.md' \
            --exclude='agents.md' \
            --exclude='*.md' \
            --exclude='deploy-local.sh' \
            --exclude='deploy-local.ps1' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ deploy-package/

      # 10. Create required directories in package
      - name: Create Required Directories
        run: |
          mkdir -p deploy-package/storage/framework/cache
          mkdir -p deploy-package/storage/framework/sessions
          mkdir -p deploy-package/storage/framework/views
          mkdir -p deploy-package/storage/logs
          mkdir -p deploy-package/bootstrap/cache

      # 11. Set proper permissions
      - name: Set Permissions
        run: |
          chmod -R 755 deploy-package/storage
          chmod -R 755 deploy-package/bootstrap/cache

      # 14. Deploy to Shared Hosting via FTP (Incremental Upload)
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.DEPLOY_FTP_USERNAME }}
          password: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Incremental upload - only changed files
          dangerous-clean-slate: false
          # FTP-Deploy-Action automatically tracks changes using .ftp-deploy-sync-state.json
          state-name: .ftp-deploy-sync-state.json
          # Files to exclude from upload
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            .env
          # Dry run for testing (set to true to test without uploading)
          dry-run: false
          # Log level: minimal, standard, verbose
          log-level: standard

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 3306
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php artisan migrate --force

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 3306
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php artisan migrate --force --seed

      # 15. Deployment Success Notification
      - name: Deployment Success
        if: success()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║   ✅ Deployment Completed Successfully!                  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "🚀 Application URL: ${{ secrets.APP_URL }}"
          echo ""
          echo "📊 Deployment Method: Incremental FTP Upload"
          echo "   (Only changed files were uploaded)"
          echo ""
          echo "📋 Post-Deployment Manual Steps (No SSH Access):"
          echo "──────────────────────────────────────────────────────────"
          echo ""
          echo "Please complete these steps via cPanel File Manager:"
          echo ""
          echo "1️⃣  Verify .env file:"
          echo "   - Check .env exists in application root"
          echo "   - Ensure APP_ENV=production, APP_DEBUG=false"
          echo ""
          echo "2️⃣  Check folder permissions (755 required):"
          echo "   - storage/"
          echo "   - storage/framework/"
          echo "   - storage/logs/"
          echo "   - bootstrap/cache/"
          echo ""
          echo "3️⃣  Clear cache files manually:"
          echo "   - Delete: bootstrap/cache/config.php"
          echo "   - Delete: bootstrap/cache/routes-*.php"
          echo "   - Delete all files in: storage/framework/views/"
          echo ""
          echo "5️⃣  First deployment only:"
          echo "   - Verify database tables created"
          echo "   - Run seeders if needed (manually via phpMyAdmin)"
          echo ""
          echo "6️⃣  Test the application:"
          echo "   - Open: ${{ secrets.APP_URL }}"
          echo "   - Check: ${{ secrets.APP_URL }}/admin"
          echo "   - Monitor: storage/logs/laravel.log for errors"
          echo ""
          echo "📝 Note: FTP-Deploy-Action tracks file changes automatically."
          echo "   Next deployments will be faster (only changed files)."
          echo ""

      # 16. Deployment Failed Notification
      - name: Deployment Failed
        if: failure()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║   ❌ Deployment Failed!                                  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "Please check the error logs above and verify:"
          echo ""
          echo "1. FTP credentials are correct in GitHub Secrets"
          echo "2. FTP_SERVER_DIR path exists on server"
          echo "3. Server has enough disk space"
          echo "4. FTP connection is not blocked by firewall"
          echo ""
          echo "For detailed troubleshooting, see: DEPLOYMENT.md"
          echo ""
