name: Deploy to Rumahweb Shared Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: BUILD ALL ASSETS (Runs entirely on GitHub)
  # ========================================================
  build:
    name: Build PHP & Node Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, json

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM and Build Assets
        run: |
          npm ci
          npm run build

      - name: Package Application into ZIP
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          shopt -s dotglob
          zip -r deploy.zip * -x ".git/*" "node_modules/*"

      # Save the zip archive so the deployment job can access it
      - name: Upload Zip as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-deploy-package
          path: deploy.zip
          retention-days: 1 # Automatically deletes the temp file after 1 day

  # ========================================================
  # JOB 2: DEPLOY TO SERVER (Can be retried if it fails!)
  # ========================================================
  deploy:
    name: Upload and Extract to Rumahweb
    needs: build # Ensures this job only runs if the build finishes successfully
    runs-on: ubuntu-latest
    steps:
      # Download the pre-built zip archive from the Build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-deploy-package
          path: .

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -v -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || echo "Warning: ssh-keyscan failed"

      - name: Upload Zip via SCP
        run: |
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa \
            deploy.zip ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/public_html/

      - name: Extract and Optimize on Rumahweb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/public_html/

            # Unzip overwriting old files
            unzip -o deploy.zip
            rm deploy.zip

            # Optimize Laravel
            php artisan key:generate
            php artisan migrate --force
            php artisan db:seed --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:clear-cached-components
