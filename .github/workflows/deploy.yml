name: Deploy to Rumahweb Shared Hosting

on:
  push:
    branches:
      - main      # Deploy saat push ke branch main
      - master    # Atau master (sesuaikan dengan branch utama Anda)
  workflow_dispatch:  # Memungkinkan manual trigger dari GitHub UI

jobs:
  deploy:
    name: Deploy Laravel Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
          tools: composer:v2

      # 3. Cache Composer dependencies
      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 4. Install Composer Dependencies (production only)
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-dev --no-scripts --no-progress --optimize-autoloader

      # 5. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 6. Cache Node modules
      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 7. Install NPM Dependencies
      - name: Install NPM Dependencies
        run: npm ci

      # 8. Build Assets
      - name: Build Production Assets
        run: npm run build

      # 9. Create deployment package (exclude unnecessary files)
      - name: Create Deployment Package
        run: |
          mkdir -p deploy-package
          rsync -av --progress \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='README.md' \
            --exclude='AGENTS.md' \
            --exclude='claude.md' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ deploy-package/

      # 10. Create required directories in package
      - name: Create Required Directories
        run: |
          mkdir -p deploy-package/storage/framework/cache
          mkdir -p deploy-package/storage/framework/sessions
          mkdir -p deploy-package/storage/framework/views
          mkdir -p deploy-package/storage/logs
          mkdir -p deploy-package/bootstrap/cache

      # 11. Set proper permissions
      - name: Set Permissions
        run: |
          chmod -R 755 deploy-package/storage
          chmod -R 755 deploy-package/bootstrap/cache

      # 12. Deploy to Shared Hosting via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            storage/logs/**
            .env

      # 13. Run post-deployment commands via SSH (Optional - jika hosting support SSH)
      # Uncomment jika Rumahweb Anda support SSH
      # - name: Run Post-Deployment Commands
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USERNAME }}
      #     password: ${{ secrets.SSH_PASSWORD }}
      #     port: ${{ secrets.SSH_PORT }}
      #     script: |
      #       cd ${{ secrets.FTP_SERVER_DIR }}
      #       php artisan config:cache
      #       php artisan route:cache
      #       php artisan view:cache
      #       php artisan migrate --force

      # 14. Deployment Success Notification
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment to Rumahweb completed successfully!"
          echo "🚀 Application URL: ${{ secrets.APP_URL }}"

      # 15. Deployment Failed Notification
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed! Please check the logs above."
